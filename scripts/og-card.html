<!doctype html>
<!--
  Share-image template (1200x630) for public/og/<product>.png and og/fyrxlab.png.
  Re-render after changing a product's name/color/tagline:
    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new
      --allow-file-access-from-files --hide-scrollbars --window-size=1200,630
      --screenshot=public\og\solver.png "file:///C:/FyrxLab/FyrxDocs/scripts/og-card.html?p=solver"
  (?p= takes a productPalette.js key, or "fyrxlab" for the studio card)
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    --c: #1aa3dd;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    position: relative;
    background:
      radial-gradient(700px 380px at 88% -60px, color-mix(in srgb, var(--c) 60%, transparent), transparent 70%),
      linear-gradient(180deg, #4fb8ee 0%, #9fdcfb 40%, #d9f3ff 75%, #f3fbff 100%);
  }
  .clouds { position: absolute; inset: 0;
    background:
      radial-gradient(320px 80px at 78% 88%, rgba(255,255,255,.95), transparent 70%),
      radial-gradient(240px 60px at 92% 80%, rgba(255,255,255,.85), transparent 70%),
      radial-gradient(380px 90px at 8% 96%, rgba(255,255,255,.9), transparent 70%); }
  .bubble { position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,.25) 22%, rgba(160,225,255,.12) 55%, rgba(255,255,255,.5) 100%);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.55); }
  svg.swoosh { position: absolute; left: 0; bottom: 30px; width: 1200px; height: 170px; }
  svg.swoosh path { fill: none; stroke: #fff; }
  .card { position: absolute; left: 80px; right: 80px; top: 50%; transform: translateY(-54%); display: flex; align-items: center; gap: 56px; }
  .orb { flex-shrink: 0; width: 230px; height: 230px; border-radius: 50%; position: relative; display: grid; place-items: center;
    background:
      radial-gradient(ellipse 62% 40% at 50% 20%, rgba(255,255,255,.85), rgba(255,255,255,0) 72%),
      radial-gradient(circle at 50% 120%, color-mix(in srgb, var(--c) 55%, white), var(--c) 45%, color-mix(in srgb, var(--c) 50%, black));
    box-shadow: 0 30px 60px -20px color-mix(in srgb, var(--c) 75%, #06304f), inset 0 -6px 18px rgba(0,0,0,.18); }
  .orb img { width: 58%; height: 58%; object-fit: contain; filter: drop-shadow(0 0 2px rgba(0,0,0,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.35)); }
  .orb i { font-size: 96px; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .text { min-width: 0; }
  .kind { font: 600 22px/1 Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: #0b5e98; }
  h1 { margin-top: 14px; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -.02em;
    background: linear-gradient(180deg, #0d6fb0 0%, #1aa3dd 55%, #0b5e98 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(255,255,255,.7)) drop-shadow(0 8px 18px rgba(6,60,110,.25)); }
  p.tag { margin-top: 22px; font-size: 30px; line-height: 1.35; color: #06304f; max-width: 26ch; }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 44px; display: flex; justify-content: space-between; align-items: center;
    font: 600 24px/1 "Segoe UI", sans-serif; color: #06304f; }
  .pill { padding: 10px 22px; border-radius: 999px; color: #06304f;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.35)); border: 1.5px solid rgba(255,255,255,.95);
    box-shadow: 0 10px 24px -12px rgba(6,48,79,.5); }
</style>
</head>
<body>
  <div class="clouds"></div>
  <span class="bubble" style="left:52%;top:9%;width:46px;height:46px"></span>
  <span class="bubble" style="left:92%;top:44%;width:30px;height:30px"></span>
  <span class="bubble" style="left:4%;top:12%;width:38px;height:38px"></span>
  <span class="bubble" style="left:44%;top:80%;width:22px;height:22px"></span>
  <svg class="swoosh" viewBox="0 0 1000 140" preserveAspectRatio="none">
    <defs>
      <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="m"><rect width="1000" height="140" fill="url(#sw)"/></mask>
    </defs>
    <g mask="url(#m)">
      <path d="M0 120 C 250 40, 520 150, 1000 50" stroke-width="3" opacity=".9"/>
      <path d="M0 132 C 300 70, 560 160, 1000 80" stroke-width="1.5" opacity=".6"/>
      <path d="M0 110 C 220 30, 600 130, 1000 30" stroke-width="12" opacity=".14"/>
    </g>
  </svg>

  <div class="card">
    <div class="orb" id="orb"></div>
    <div class="text">
      <div class="kind" id="kind"></div>
      <h1 id="name"></h1>
      <p class="tag" id="tag"></p>
    </div>
  </div>
  <div class="foot"><span>FyrxLab</span><span class="pill">fyrx.net</span></div>

<script type="module">
  import { PRODUCTS } from '../.vitepress/theme/productPalette.js'
  const LOGOS = { solver: 'solver.svg', solvermotd: 'smotd.png', phos: 'phosphophyllite.png', furnace: 'absoluteenergy.png' }
  const key = new URLSearchParams(location.search).get('p') || 'fyrxlab'
  const p = PRODUCTS[key] || {
    name: 'FyrxLab', kind: 'studio', color: '#1aa3dd',
    tagline: { en: 'Serious tooling for Minecraft servers, and a few mods purely because they’re fun.' }
  }
  document.body.style.setProperty('--c', p.color)
  document.getElementById('kind').textContent = p.kind
  document.getElementById('name').textContent = p.name
  document.getElementById('tag').textContent = p.tagline.en
  const orb = document.getElementById('orb')
  if (LOGOS[key]) orb.innerHTML = `<img src="../public/${LOGOS[key]}" alt="">`
  else if (key === 'fyrxlab') orb.innerHTML = `<img src="../public/fyrx-logo-dark.svg" alt="" style="filter:brightness(0) invert(1) drop-shadow(0 4px 8px rgba(0,0,0,.3))">`
  else orb.innerHTML = `<i class="fa-solid ${p.icon}"></i>`
</script>
</body>
</html>
